[package]
name = "ok_br1_converter"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "okconv-br1"
path = "src/main.rs"
required-features = ["cli"]

[[test]]
name = "disc"
required-features = ["cli"]

[[test]]
name = "runtime"
required-features = ["runtime"]

[features]
default = ["cli"]
# the `okconv-br1` command line tool: the gallery, the folder output, ffmpeg (FLAC / MP4 / posters)
cli = ["dep:anyhow", "dep:clap"]
# `runtime::Converter`: the runtime data (no std::fs, no ffmpeg; builds for wasm32)
runtime = []

[dependencies]
anyhow = { version = "1.0.104", optional = true }
clap = { version = "4.6.7", features = ["derive"], optional = true }
# the deflate backend of the PNGs (png → flate2) pinned: zlib-rs, the one flate2 picks when another crate of a program
# enables it, so a disc converts to the same bytes in every build (`png_bytes_are_pinned`)
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
png = "0.18.1"
serde_json = "1.0.151"

[dev-dependencies]
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }
serde_json = "1.0.151"

# Tests run the real export pipeline (texture decoding, chain physics): keep
# debug/test builds optimised so `cargo test` and the pre-commit hook stay fast.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
